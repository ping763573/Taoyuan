<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣精準退休財務規劃系統 Pro</title>
    <!-- React Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f1f5f9; }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #cbd5e1;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            transition: transform .15s ease-in-out, background .15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { background: #1d4ed8; transform: scale(1.15); }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
        }
        .inflation-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            font-weight: 700;
            display: inline-block;
        }
        .cashflow-table th { background-color: #f8fafc; color: #475569; font-weight: 700; font-size: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid #e2e8f0; }
        .cashflow-table td { padding: 0.7rem 1rem; font-size: 0.85rem; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .cashflow-table tr:hover td { background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 台灣現況預設參數 ---
        const DEFAULT_PARAMS = {
            currentAge: 40,
            retireAge: 65,
            lifeExpectancy: 88,          // 台灣平均壽命延長，安全邊際建議設為 88 歲
            inflationRate: 2.3,          // 台灣近年結構性通膨率約 2.0%~2.5%
            preRetireRoiRate: 7.0,       // 台美股指數化投資長期年化報酬參考
            postRetireRoiRate: 4.5,      // 退休後股債配置或高股息穩健配置報酬率
            currentSavings: 1500000,     // 目前已累積可投資退休本金 (新增)
            currentMonthlyInvestment: 15000, // 目前每月定期定額
            laborPensionLumpSum: 2500000,// 勞退新制預估累積總額 (雇主6%+自提)
            laborInsuranceMonthly: 22000,// 勞保老年年金預估月領
            adjustLaborInsForInflation: true, // 勞保年金隨CPI調升機制 (新增)
            medicalInsuranceCoverage: 0, // 0: 無, 50: 部分覆蓋(50%), 100: 足額覆蓋
            ltcInsuranceCoverage: 0,     // 0: 無, 50: 部分覆蓋(50%), 100: 足額覆蓋
        };

        const DEFAULT_ITEMS = [
            { id: 1, name: '基本生活費 (含水電伙食)', type: 'flow', currentAmount: 32000, annualMonths: 12 },
            { id: 2, name: '休閒旅遊與娛樂費', type: 'flow', currentAmount: 10000, annualMonths: 12 },
            { id: 3, name: '健保與日常保健品', type: 'flow', currentAmount: 4000, annualMonths: 12 },
            { id: 4, name: '老年自費醫療預備金', type: 'stock', currentAmount: 2500000, isInsuranceItem: 'medical' },
            { id: 5, name: '長照機構/看護預備金 (約7.3年)', type: 'stock', currentAmount: 4200000, isInsuranceItem: 'ltc' },
        ];

        const STORAGE_KEY = 'tw_retire_planner_v2';

        // --- Formatters ---
        const formatCurrency = (num) => {
            if (num === undefined || num === null || isNaN(num)) return "$0";
            return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(num);
        };

        const formatNumber = (num) => {
            if (num === undefined || num === null || isNaN(num)) return "0";
            return new Intl.NumberFormat('zh-TW').format(Math.round(num));
        };

        const formatWan = (num) => {
            if (!num || isNaN(num)) return "0 萬";
            return (num / 10000).toFixed(1) + " 萬";
        };

        // --- 勞退新制快速估算小工具 Modal ---
        const LaborPensionModal = ({ isOpen, onClose, yearsToRetire, onApply }) => {
            const [salary, setSalary] = useState(55000);
            const [currentAcc, setCurrentAcc] = useState(600000);
            const [selfRate, setSelfRate] = useState(6);
            const [roi, setRoi] = useState(4.0);
            const [salaryGrowth, setSalaryGrowth] = useState(2.0);

            if (!isOpen) return null;

            // 計算至退休時的勞退專戶累積總額
            let balance = currentAcc;
            let curSalary = salary;
            const totalRate = (6 + selfRate) / 100;
            for (let y = 0; y < yearsToRetire; y++) {
                const yearlyContrib = curSalary * totalRate * 12;
                balance = balance * (1 + roi / 100) + yearlyContrib * (1 + (roi / 100) / 2);
                curSalary *= (1 + salaryGrowth / 100);
            }

            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                        <div className="flex justify-between items-center mb-4 pb-3 border-b">
                            <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i className="fas fa-calculator text-purple-600"></i> 勞退新制專戶試算器
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="space-y-4 text-sm">
                            <div>
                                <label className="block text-slate-600 mb-1">目前勞退專戶已累積金額 (元)</label>
                                <input type="number" value={currentAcc} onChange={e => setCurrentAcc(Number(e.target.value))} className="w-full p-2 border rounded font-bold text-slate-700" />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-slate-600 mb-1">目前月提繳工資</label>
                                    <input type="number" value={salary} onChange={e => setSalary(Number(e.target.value))} className="w-full p-2 border rounded font-bold text-slate-700" />
                                </div>
                                <div>
                                    <label className="block text-slate-600 mb-1">個人自提比例 (0~6%)</label>
                                    <select value={selfRate} onChange={e => setSelfRate(Number(e.target.value))} className="w-full p-2 border rounded font-bold text-blue-600 bg-blue-50">
                                        <option value={0}>0% (僅雇主6%)</option>
                                        <option value={3}>3% (共9%，享節稅)</option>
                                        <option value={6}>6% (共12%，享節稅)</option>
                                    </select>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-slate-600 mb-1">預估勞動基金年化報酬</label>
                                    <input type="number" step="0.5" value={roi} onChange={e => setRoi(Number(e.target.value))} className="w-full p-2 border rounded text-slate-700" />
                                </div>
                                <div>
                                    <label className="block text-slate-600 mb-1">預估每年調薪幅度 (%)</label>
                                    <input type="number" step="0.5" value={salaryGrowth} onChange={e => setSalaryGrowth(Number(e.target.value))} className="w-full p-2 border rounded text-slate-700" />
                                </div>
                            </div>
                            <div className="bg-purple-50 p-4 rounded-xl border border-purple-100 mt-4">
                                <div className="text-xs text-purple-600">距離退休還有 {yearsToRetire} 年，預估退休時專戶累積：</div>
                                <div className="text-2xl font-extrabold text-purple-800 mt-1">{formatCurrency(Math.round(balance))}</div>
                                <div className="text-[11px] text-purple-500 mt-1">* 自提部分可自當年度個人綜合所得總額中全數扣除</div>
                            </div>
                        </div>
                        <div className="flex gap-3 mt-6">
                            <button onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">取消</button>
                            <button onClick={() => { onApply(Math.round(balance)); onClose(); }} className="flex-1 py-2.5 rounded-xl bg-purple-600 text-white font-bold hover:bg-purple-700">套用此金額</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Chart Component ---
        const CashFlowChart = ({ chartData, retireAge, lifeExpectancy }) => {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);

            const downloadChart = () => {
                if (chartInstanceRef.current) {
                    const link = document.createElement('a');
                    link.download = `全生涯退休資產軌跡_${retireAge}至${lifeExpectancy}歲.png`;
                    link.href = chartInstanceRef.current.toBase64Image();
                    link.click();
                }
            };

            useEffect(() => {
                if (!canvasRef.current || !chartData) return;
                const ctx = canvasRef.current.getContext('2d');
                if (chartInstanceRef.current) chartInstanceRef.current.destroy();

                chartInstanceRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: chartData.labels,
                        datasets: [
                            {
                                label: '理想無缺口資產軌跡',
                                data: chartData.ideal,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.05)',
                                borderWidth: 2.5,
                                borderDash: [4, 4],
                                pointRadius: 0,
                                fill: false,
                                tension: 0.35
                            },
                            {
                                label: '目前預估資產軌跡 (含現有本金/定期定額/勞保勞退)',
                                data: chartData.actual,
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245, 158, 11, 0.12)',
                                borderWidth: 3,
                                pointRadius: 2,
                                fill: true,
                                tension: 0.35
                            },
                            {
                                label: '資產歸零警戒線',
                                data: Array(chartData.labels.length).fill(0),
                                borderColor: '#ef4444',
                                borderWidth: 1.5,
                                pointRadius: 0,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: (context) => `${context.dataset.label}: ${formatCurrency(context.parsed.y)}`
                                }
                            },
                            legend: { position: 'bottom' },
                        },
                        scales: {
                            y: {
                                ticks: { callback: (value) => (value / 10000).toFixed(0) + '萬' },
                                grid: { color: '#f1f5f9' }
                            },
                            x: { grid: { display: false } }
                        }
                    }
                });

                return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
            }, [chartData]);

            return (
                <div className="relative w-full h-80 md:h-96 bg-white p-2 rounded-xl">
                    <button onClick={downloadChart} className="absolute top-0 right-0 m-2 z-10 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 transition">
                        <i className="fas fa-download"></i> 下載圖表
                    </button>
                    <canvas ref={canvasRef}></canvas>
                </div>
            );
        };

        const App = () => {
            // 載入 LocalStorage 或預設值
            const [params, setParams] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { return { ...DEFAULT_PARAMS, ...JSON.parse(saved).params }; } catch (e) {}
                }
                return DEFAULT_PARAMS;
            });

            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { return JSON.parse(saved).items || DEFAULT_ITEMS; } catch (e) {}
                }
                return DEFAULT_ITEMS;
            });

            const [isPensionModalOpen, setIsPensionModalOpen] = useState(false);

            // 自動儲存至 LocalStorage
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ params, items }));
            }, [params, items]);

            // --- 核心財務試算模型 (即時響應 useMemo) ---
            const result = useMemo(() => {
                const yearsToRetire = Math.max(0, params.retireAge - params.currentAge);
                const monthsToRetire = yearsToRetire * 12;
                const yearsInRetirement = Math.max(1, params.lifeExpectancy - params.retireAge);

                const inflationRate = params.inflationRate / 100;
                const roiRate = params.postRetireRoiRate / 100;
                const preRoiRate = params.preRetireRoiRate / 100;

                const inflationMultiplier = Math.pow(1 + inflationRate, yearsToRetire);

                // 1. 退休前資產累積 (現有本金複利 + 每月定期定額終值)
                const currentSavingsFV = (params.currentSavings || 0) * Math.pow(1 + preRoiRate, yearsToRetire);
                let monthlyInvestFV = 0;
                if (params.currentMonthlyInvestment > 0 && yearsToRetire > 0) {
                    const monthlyRate = preRoiRate / 12;
                    monthlyInvestFV = monthlyRate > 0
                        ? params.currentMonthlyInvestment * ((Math.pow(1 + monthlyRate, monthsToRetire) - 1) / monthlyRate)
                        : params.currentMonthlyInvestment * monthsToRetire;
                }
                const totalSelfInvestmentFV = currentSavingsFV + monthlyInvestFV;
                const startAssets = (params.laborPensionLumpSum || 0) + totalSelfInvestmentFV;

                // 2. 退休各項支出折現與首年需求計算
                let stockExpensesAtRetire = 0;
                let baseFlowExpenseAtRetire = 0;

                const detailedItems = items.map(item => {
                    let coverageRatio = 0;
                    if (item.isInsuranceItem === 'medical') coverageRatio = (params.medicalInsuranceCoverage || 0) / 100;
                    if (item.isInsuranceItem === 'ltc') coverageRatio = (params.ltcInsuranceCoverage || 0) / 100;

                    const effectiveCurrentAmount = item.currentAmount * (1 - coverageRatio);

                    let annualFutureAtRetire = 0;
                    let monthlyFutureAtRetire = 0;

                    if (item.type === 'stock') {
                        annualFutureAtRetire = effectiveCurrentAmount * inflationMultiplier;
                        stockExpensesAtRetire += annualFutureAtRetire;
                    } else {
                        monthlyFutureAtRetire = effectiveCurrentAmount * inflationMultiplier;
                        annualFutureAtRetire = monthlyFutureAtRetire * (item.annualMonths || 12);
                        baseFlowExpenseAtRetire += annualFutureAtRetire;
                    }

                    return {
                        ...item,
                        coverageRatio,
                        monthlyFuture: monthlyFutureAtRetire, // 修正原版未定義之欄位
                        futureValue: annualFutureAtRetire,
                        requiredCapital: 0
                    };
                });

                // 3. 退休期間現金流折現 (NPV at Retire Age)
                let npvExpenses = 0;
                let npvIncome = 0;
                const baseLaborInsAnnual = (params.laborInsuranceMonthly || 0) * 12;

                for (let i = 1; i <= yearsInRetirement; i++) {
                    const discountFactor = Math.pow(1 + roiRate, i);
                    const expenseThisYear = baseFlowExpenseAtRetire * Math.pow(1 + inflationRate, i - 1);
                    // 若開啟勞保抗通膨調升，勞保年金隨通膨率成長
                    const laborInsThisYear = params.adjustLaborInsForInflation
                        ? baseLaborInsAnnual * Math.pow(1 + inflationRate, i - 1)
                        : baseLaborInsAnnual;

                    npvExpenses += expenseThisYear / discountFactor;
                    npvIncome += laborInsThisYear / discountFactor;
                }
                npvExpenses += stockExpensesAtRetire;

                const totalPVNeeded = npvExpenses;
                const totalPVHave = npvIncome + startAssets;
                const finalShortfall = totalPVNeeded - totalPVHave;

                // 分配各項目的應備本金權重
                const totalFlowPV = npvExpenses - stockExpensesAtRetire;
                detailedItems.forEach(item => {
                    if (item.type === 'stock') {
                        item.requiredCapital = item.futureValue;
                    } else if (baseFlowExpenseAtRetire > 0) {
                        const ratio = item.futureValue / baseFlowExpenseAtRetire;
                        item.requiredCapital = totalFlowPV * ratio;
                    }
                });

                const govDeductions = (params.laborPensionLumpSum || 0) + npvIncome;
                const grossNeed = npvExpenses;

                // 4. 全生涯時間軸與圖表模擬
                const timelineData = [];
                const labels = [];
                const dataIdeal = [];
                const dataActual = [];

                let accumBalance = params.currentSavings || 0;
                for (let age = params.currentAge; age < params.retireAge; age++) {
                    const monthlyRate = preRoiRate / 12;
                    const yearlyContribFV = monthlyRate > 0
                        ? params.currentMonthlyInvestment * ((Math.pow(1 + monthlyRate, 12) - 1) / monthlyRate)
                        : params.currentMonthlyInvestment * 12;
                    accumBalance = accumBalance * (1 + preRoiRate) + yearlyContribFV;
                    timelineData.push({ age, type: '累積期', assets: accumBalance, income: 0, needs: 0, gap: accumBalance });
                }

                let simBalanceIdeal = startAssets + (finalShortfall > 0 ? finalShortfall : 0) - stockExpensesAtRetire;
                let simBalanceActual = startAssets - stockExpensesAtRetire;
                let currentFlowExpense = baseFlowExpenseAtRetire;
                let bankruptAge = null;

                for (let i = 0; i <= yearsInRetirement; i++) {
                    const age = params.retireAge + i;
                    labels.push(`${age}歲`);
                    dataIdeal.push(Math.round(simBalanceIdeal));
                    dataActual.push(Math.round(simBalanceActual));

                    if (simBalanceActual < 0 && bankruptAge === null) {
                        bankruptAge = age;
                    }

                    if (i < yearsInRetirement) {
                        const growthIdeal = simBalanceIdeal * roiRate;
                        const growthActual = simBalanceActual * roiRate;
                        const laborInsThisYear = params.adjustLaborInsForInflation
                            ? baseLaborInsAnnual * Math.pow(1 + inflationRate, i)
                            : baseLaborInsAnnual;
                        const netFlow = laborInsThisYear - currentFlowExpense;

                        simBalanceIdeal = simBalanceIdeal + growthIdeal + netFlow;
                        simBalanceActual = simBalanceActual + growthActual + netFlow;

                        timelineData.push({
                            age,
                            type: '退休期',
                            assets: simBalanceActual,
                            income: laborInsThisYear,
                            needs: currentFlowExpense + (i === 0 ? stockExpensesAtRetire : 0),
                            gap: simBalanceActual
                        });
                        currentFlowExpense *= (1 + inflationRate);
                    } else {
                        timelineData.push({ age, type: '規畫終點', assets: simBalanceActual, income: 0, needs: 0, gap: simBalanceActual });
                    }
                }

                // 5. 缺口回推每月應再增加定期定額 (PMT)
                let suggestedMonthlySave = 0;
                if (finalShortfall > 0 && yearsToRetire > 0) {
                    const monthlyRate = preRoiRate / 12;
                    suggestedMonthlySave = monthlyRate > 0
                        ? finalShortfall * monthlyRate / (Math.pow(1 + monthlyRate, monthsToRetire) - 1)
                        : finalShortfall / monthsToRetire;
                }
                const totalMonthlySave = (params.currentMonthlyInvestment || 0) + suggestedMonthlySave;

                // 退休首年每月被動現金流覆蓋率
                const firstYearMonthlyNeed = baseFlowExpenseAtRetire / 12;

                return {
                    yearsToRetire,
                    yearsInRetirement,
                    inflationMultiplier,
                    detailedItems,
                    grossNeed,
                    govDeductions,
                    currentSavingsFV,
                    monthlyInvestFV,
                    totalSelfInvestmentFV,
                    finalShortfall,
                    suggestedMonthlySave,
                    totalMonthlySave,
                    firstYearMonthlyNeed,
                    bankruptAge,
                    timelineData,
                    chartData: { labels, ideal: dataIdeal, actual: dataActual }
                };
            }, [params, items]);

            // --- Handlers ---
            const handleParamChange = (e) => {
                const { name, value } = e.target;
                setParams(prev => ({ ...prev, [name]: parseFloat(value) || 0 }));
            };

            const applyScenario = (type) => {
                if (type === 'conservative') {
                    setParams(p => ({ ...p, inflationRate: 2.8, preRetireRoiRate: 5.0, postRetireRoiRate: 3.5, lifeExpectancy: 90 }));
                } else if (type === 'balanced') {
                    setParams(p => ({ ...p, inflationRate: 2.3, preRetireRoiRate: 7.0, postRetireRoiRate: 4.5, lifeExpectancy: 88 }));
                } else if (type === 'growth') {
                    setParams(p => ({ ...p, inflationRate: 2.0, preRetireRoiRate: 9.0, postRetireRoiRate: 5.5, lifeExpectancy: 85 }));
                }
            };

            const handleReset = () => {
                if (confirm('確定要清除所有自訂參數並回復台灣現況預設值嗎？')) {
                    setParams(DEFAULT_PARAMS);
                    setItems(DEFAULT_ITEMS);
                    localStorage.removeItem(STORAGE_KEY);
                }
            };

            const downloadCSV = () => {
                const bom = "\uFEFF";
                let csvContent = "data:text/csv;charset=utf-8," + bom;
                csvContent += "年齡,階段,當年度勞保年金收入,當年度退休總支出(含通膨),期末資產結餘,狀態\n";
                result.timelineData.forEach(row => {
                    const status = row.gap < 0 ? '資產透支' : '正常';
                    csvContent += `${row.age},${row.type},${Math.round(row.income)},${Math.round(row.needs)},${Math.round(row.assets)},${status}\n`;
                });
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI(csvContent));
                link.setAttribute("download", `台灣全生涯退休現金流試算_${params.currentAge}至${params.lifeExpectancy}歲.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const updateItem = (id, field, value) => setItems(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            const addItem = (type = 'flow') => {
                const newId = Math.max(...items.map(i => i.id), 0) + 1;
                setItems([...items, {
                    id: newId,
                    name: type === 'flow' ? '自訂每月支出' : '自訂一次性目標',
                    type,
                    currentAmount: type === 'flow' ? 5000 : 500000,
                    annualMonths: 12
                }]);
            };
            const deleteItem = (id) => setItems(prev => prev.filter(item => item.id !== id));

            return (

                                                                <span className="inflation-badge">{result.inflationMultiplier.toFixed(2)}x</span>
                                                            </td>
                                                            <td className="px-4 py-3 text-right">
                                                                {isFullyCovered ? <span className="text-slate-400">-</span> : (
                                                                    <div>
                                                                        <span className="font-bold text-slate-700">
                                                                            {item.type === 'flow' ? formatNumber(item.monthlyFuture) : formatNumber(item.futureValue)}
                                                                        </span>
                                                                        <span className="text-[11px] text-slate-400 ml-1">{item.type === 'flow' ? '/月' : '一次'}</span>
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td className="px-4 py-3 text-right font-extrabold text-slate-800">
                                                                {isFullyCovered ? <span className="text-emerald-600">$0</span> : formatCurrency(item.requiredCapital)}
                                                            </td>
                                                            <td className="px-3 py-3 text-center">
                                                                {!item.isInsuranceItem && (
                                                                    <button onClick={() => deleteItem(item.id)} className="text-slate-300 hover:text-rose-500 transition">
                                                                        <i className="fas fa-trash-alt"></i>
                                                                    </button>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* 3. 全生涯現金流明細表 */}
                                <div className="glass-card rounded-2xl overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                                        <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                            <i className="fas fa-table text-slate-500"></i> 全生涯年度現金流明細表 ({params.currentAge}歲 ~ {params.lifeExpectancy}歲)
                                        </h3>
                                        <button onClick={downloadCSV} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
                                            <i className="fas fa-file-csv"></i> 匯出 CSV 報表
                                        </button>
                                    </div>
                                    <div className="overflow-x-auto max-h-96">
                                        <table className="w-full text-left cashflow-table">
                                            <thead className="sticky top-0 z-10 shadow-sm">
                                                <tr>
                                                    <th>年齡</th>
                                                    <th>階段</th>
                                                    <th className="text-right">當年度勞保年金</th>
                                                    <th className="text-right">當年度總支出 (含通膨)</th>
                                                    <th className="text-right">期末資產結餘</th>
                                                    <th className="text-right">財務狀態</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {result.timelineData.map((row) => (
                                                    <tr key={row.age} className={row.gap < 0 ? 'bg-rose-50/70' : ''}>
                                                        <td className="font-bold text-slate-700">{row.age} 歲</td>
                                                        <td>
                                                            <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${row.type === '累積期' ? 'bg-blue-100 text-blue-700' : row.type === '退休期' ? 'bg-amber-100 text-amber-700' : 'bg-slate-200 text-slate-700'}`}>
                                                                {row.type}
                                                            </span>
                                                        </td>
                                                        <td className="text-right font-mono text-purple-600">{row.income > 0 ? `+${formatNumber(row.income)}` : '-'}</td>
                                                        <td className="text-right font-mono text-rose-600">{row.needs > 0 ? `-${formatNumber(row.needs)}` : '-'}</td>
                                                        <td className="text-right font-mono font-bold text-slate-800">{formatNumber(row.assets)}</td>
                                                        <td className={`text-right font-bold ${row.gap < 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                                                            {row.gap < 0 ? '⚠️ 透支缺口' : '✅ 資產穩健'}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
