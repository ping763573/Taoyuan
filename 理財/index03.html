/* ============ 建立與更新畫面 ============ */
function build() {
  container.innerHTML = SLIDES.map((s, i) => `
    <section class="slide absolute inset-0" data-i="${i}" aria-roledescription="slide" aria-label="${i+1} / ${SLIDES.length}">
      <div class="slide-bg absolute inset-0" data-bg="${s.bg}"></div>
      <div class="scroll-area absolute inset-0 px-4 md:px-12 pt-16 md:pt-20 pb-24 md:pb-28">${R[s.type](s)}</div>
    </section>`).join('');
  $('#dots').innerHTML = SLIDES.map((_, i) => `<button class="rounded-full transition-all bg-white/50 hover:bg-white" data-dot="${i}" aria-label="${UI[lang].go}${i+1}" style="width:.75rem;height:.75rem"></button>`).join('');
  document.title = t(SLIDES[0].title) + ' | ' + (lang === 'zh' ? '互動導覽' : 'Interactive Guide');
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  refreshUI();
  show(index, true);
}

function refreshUI() {
  const u = UI[lang];
  $('#langBtn').textContent = u.langBtn; $('#langBtn').setAttribute('aria-label', u.lang);
  $('#prevBtn').setAttribute('aria-label', u.prev); $('#nextBtn').setAttribute('aria-label', u.next);
  $('#helpBtn').setAttribute('aria-label', u.help);
  $('#speakBtn').setAttribute('aria-label', speaking ? u.stopSpeak : u.speak); $('#speakBtn').title = speaking ? u.stopSpeak : u.speak;
  $('#playBtn').setAttribute('aria-label', autoplay ? u.pause : u.play); $('#playBtn').title = autoplay ? u.pause : u.play;
  $('#musicBtn').setAttribute('aria-label', musicOn ? u.musicOff : u.music); $('#musicBtn').title = musicOn ? u.musicOff : u.music;
  const fs = !!document.fullscreenElement;
  $('#fsBtn').setAttribute('aria-label', fs ? u.fsExit : u.fs); $('#fsBtn').title = fs ? u.fsExit : u.fs;
  $('#helpTitle').textContent = u.helpTitle; $('#helpClose').textContent = u.close;
  $('#helpList').innerHTML = u.helpItems.map(x => `<li>${x}</li>`).join('');
  $('#speakBtn').classList.toggle('on', speaking); $('#playBtn').classList.toggle('on', autoplay); $('#musicBtn').classList.toggle('on', musicOn);
  $('#playBtn').innerHTML = `<i class="fa fa-${autoplay ? 'pause' : 'play'}"></i>`;
  $('#speakBtn').innerHTML = `<i class="fa fa-${speaking ? 'stop' : 'volume-up'}"></i>`;
  $('#musicBtn').innerHTML = `<i class="fa fa-${musicOn ? 'volume-off' : 'music'}"></i>`;
  $('#fsBtn').innerHTML = `<i class="fa fa-${fs ? 'compress' : 'expand'}"></i>`;
}

function loadBg(i) {
  const n = SLIDES.length, el = container.children[((i % n) + n) % n]?.querySelector('.slide-bg');
  if (el && !el.dataset.loaded) { el.style.backgroundImage = `url("${el.dataset.bg}")`; el.dataset.loaded = '1'; }
}

function show(i, silent) {
  const n = SLIDES.length; index = ((i % n) + n) % n;
  [...container.children].forEach((sl, k) => {
    const on = k === index;
    sl.classList.toggle('active', on); sl.inert = !on; sl.setAttribute('aria-hidden', String(!on));
    if (on) sl.querySelector('.scroll-area').scrollTop = 0;
  });
  [index - 1, index, index + 1].forEach(loadBg);
  $('#counter').textContent = `${index + 1} / ${n}`;
  [...$('#dots').children].forEach((d, k) => { const on = k === index; d.style.width = d.style.height = on ? '1rem' : '.75rem'; d.style.background = on ? '#D9AE6C' : ''; d.setAttribute('aria-current', on ? 'true' : 'false'); });
  if (!silent) history.replaceState(null, '', '#' + (index + 1));
  if (speaking) stopSpeak();
  schedule();
}
const next = () => show(index + 1), prev = () => show(index - 1);

/* ============ 自動播放 ============ */
function schedule() {
  clearTimeout(timer); const bar = $('#progress'); bar.classList.remove('run'); void bar.offsetWidth;
  if (!autoplay) return;
  const ms = SLIDES[index].type === 'hero' || SLIDES[index].type === 'end' ? 7000 : 12000;
  bar.style.setProperty('--dur', ms + 'ms'); bar.classList.add('run');
  timer = setTimeout(next, ms);
}
function toggleAuto() { autoplay = !autoplay; schedule(); refreshUI(); toast(autoplay ? UI[lang].pause : UI[lang].play); }

/* ============ 朗讀 ============ */
function stopSpeak() { try { speechSynthesis.cancel(); } catch(e){} speaking = false; refreshUI(); }
function toggleSpeak() {
  if (!('speechSynthesis' in window)) return toast(UI[lang].noSpeech);
  if (speaking) return stopSpeak();
  const text = container.children[index].querySelector('.scroll-area').innerText.replace(/\s+/g, ' ').trim();
  const u = new SpeechSynthesisUtterance(text); u.lang = lang === 'zh' ? 'zh-TW' : 'en-US'; u.rate = .95;
  u.onend = u.onerror = () => { speaking = false; refreshUI(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u); speaking = true; refreshUI();
}

/* ============ 音樂 / 全螢幕 / 語言 / 提示 ============ */
function toggleMusic() {
  const a = $('#bgMusic');
  if (!musicOn) a.play().then(() => { musicOn = true; refreshUI(); }).catch(() => toast(UI[lang].musicFail));
  else { a.pause(); musicOn = false; refreshUI(); }
}
function toggleFs() {
  if (!document.fullscreenEnabled) return;
  if (!document.fullscreenElement) $('#app').requestFullscreen().catch(() => {}); else document.exitFullscreen();
}
function setLang(l) { lang = l; store.set('npm-lang', l); if (speaking) stopSpeak(); build(); }
let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 2600); }

/* ============ 事件 ============ */
$('#prevBtn').onclick = prev; $('#nextBtn').onclick = next;
$('#playBtn').onclick = toggleAuto; $('#speakBtn').onclick = toggleSpeak; $('#musicBtn').onclick = toggleMusic;
$('#fsBtn').onclick = toggleFs; $('#langBtn').onclick = () => setLang(lang === 'zh' ? 'en' : 'zh');
$('#helpBtn').onclick = () => $('#helpDlg').showModal(); $('#helpClose').onclick = () => $('#helpDlg').close();
document.addEventListener('fullscreenchange', refreshUI);

document.addEventListener('click', e => {
  const dot = e.target.closest('[data-dot]'); if (dot) return show(+dot.dataset.dot);
  const go = e.target.closest('[data-go]'); if (go) return show(+go.dataset.go);
  if (e.target.closest('[data-speak]')) toggleSpeak();
});

document.addEventListener('keydown', e => {
  if (e.target.closest('dialog[open]') && e.key !== 'Escape') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': next(); break;
    case 'ArrowLeft': case 'PageUp': prev(); break;
    case 'Home': show(0); break;
    case 'End': show(SLIDES.length - 1); break;
    case ' ': if (!e.target.closest('button, a')) { e.preventDefault(); toggleAuto(); } break;
    case 'f': case 'F': toggleFs(); break;
    case 'm': case 'M': toggleMusic(); break;
    case 'r': case 'R': toggleSpeak(); break;
    case '?': $('#helpDlg').showModal(); break;
  }
});

/* 觸控滑動：橫向為主才換頁，不影響上下捲動 */
let sx = 0, sy = 0;
container.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
container.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? next() : prev(); }
}, { passive: true });
/* 使用者操作內容時，重新計時自動播放，避免閱讀到一半被切換 */
['pointerdown', 'wheel', 'scroll'].forEach(ev => container.addEventListener(ev, () => { if (autoplay) schedule(); }, { passive: true, capture: true }));
window.addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n >= 1 && n <= SLIDES.length && n - 1 !== index) show(n - 1, true); });

/* ============ 啟動 ============ */
const startN = parseInt(location.hash.slice(1), 10);
if (startN >= 1 && startN <= SLIDES.length) index = startN - 1;
build();
if (!store.get('npm-hint')) { setTimeout(() => toast(UI[lang].hint), 1200); store.set('npm-hint', '1'); }
</script>
</body>
</html>
