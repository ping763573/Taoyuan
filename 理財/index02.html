                                    {/* 退休首年每月被動現金流三欄指標卡 (整合房產活化現金流) */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                                        <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                            <div className="text-xs text-slate-500">退休首年每月支出需求 (通膨後)</div>
                                            <div className="text-xl font-extrabold text-slate-800 mt-1">{formatCurrency(result.firstYearMonthlyNeed)} <span className="text-xs font-normal text-slate-400">/月</span></div>
                                            <div className="text-[11px] text-slate-400 mt-1">相當於現值 {formatCurrency(result.firstYearMonthlyNeed / result.inflationMultiplier)} /月</div>
                                        </div>
                                        <div className="bg-amber-50/70 p-3.5 rounded-xl border border-amber-200">
                                            <div className="text-xs text-amber-800">退休首年每月「稅後總被動收入」</div>
                                            <div className="text-xl font-extrabold text-amber-700 mt-1">{formatCurrency(result.firstYearTotalPassiveMonthly)} <span className="text-xs font-normal text-amber-600">/月</span></div>
                                            <div className="text-[11px] text-amber-700 mt-1 leading-tight">
                                                含稅後配息 <strong>{formatCurrency(result.firstYearNetMonthlyDividend)}</strong> + 勞保 <strong>{formatCurrency(params.laborInsuranceMonthly)}</strong>
                                                {params.realEstateMode !== 'none' && (
                                                    <span className="text-teal-700 font-bold"> + 房產 {formatCurrency(result.firstYearRealEstateMonthly)}</span>
                                                )}
                                            </div>
                                        </div>
                                        <div className={`p-3.5 rounded-xl border ${result.dividendCoverageRatio >= 100 ? 'bg-emerald-50/70 border-emerald-200' : 'bg-rose-50/70 border-rose-200'}`}>
                                            <div className="text-xs text-slate-600">退休首年「不賣股現金流覆蓋率」</div>
                                            <div className={`text-xl font-extrabold mt-1 ${result.dividendCoverageRatio >= 100 ? 'text-emerald-700' : 'text-rose-600'}`}>
                                                {result.dividendCoverageRatio.toFixed(0)}%
                                            </div>
                                            <div className="text-[11px] text-slate-500 mt-1">
                                                {result.dividendCoverageRatio >= 100 ? '✅ 配息+勞保+房產完全覆蓋生活費' : '⚠️ 被動現金流不足，需賣出部分資產'}
                                            </div>
                                        </div>
                                    </div>

                                    {/* 退休首年「二代健保補充保費 vs 股利 8.5% 抵減退稅」拆解橫幅 */}
                                    {result.isDividendMode && params.enableTaxAndNHI && (
                                        <div className="mb-5 bg-teal-50/70 border border-teal-200 rounded-xl p-3.5 text-xs">
                                            <div className="font-bold text-teal-900 mb-2 flex items-center justify-between">
                                                <span><i className="fas fa-balance-scale mr-1.5"></i>退休首年（{params.retireAge}歲）配息稅費與二代健保年度結算預估</span>
                                                <span className="text-[11px] text-teal-700 font-normal">
                                                    境內應稅 54C 股利：{formatCurrency(result.firstYearTaxBreakdown.taxable54CDividend)}/年
                                                </span>
                                            </div>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
                                                <div className="bg-white p-2 rounded-lg border border-teal-100">
                                                    <div className="text-slate-400 text-[11px]">稅前總配息/年</div>
                                                    <div className="font-bold text-slate-700 text-sm mt-0.5">{formatCurrency(result.firstYearTaxBreakdown.grossDividend)}</div>
                                                </div>
                                                <div className="bg-white p-2 rounded-lg border border-teal-100">
                                                    <div className="text-slate-400 text-[11px]">二代健保補充保費 (2.11%)</div>
                                                    <div className="font-bold text-rose-600 text-sm mt-0.5">
                                                        -{formatCurrency(result.firstYearTaxBreakdown.nhiFee)}
                                                    </div>
                                                </div>
                                                <div className="bg-white p-2 rounded-lg border border-teal-100">
                                                    <div className="text-slate-400 text-[11px]">股利綜所稅 / 8.5%抵減</div>
                                                    <div className={`font-bold text-sm mt-0.5 ${result.firstYearTaxBreakdown.incomeTaxOrCredit <= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                        {result.firstYearTaxBreakdown.incomeTaxOrCredit <= 0
                                                            ? `退稅 +${formatCurrency(Math.abs(result.firstYearTaxBreakdown.incomeTaxOrCredit))}`
                                                            : `應繳 -${formatCurrency(result.firstYearTaxBreakdown.incomeTaxOrCredit)}`}
                                                    </div>
                                                </div>
                                                <div className="bg-white p-2 rounded-lg border border-teal-100">
                                                    <div className="text-slate-400 text-[11px]">稅費結算後實領淨配息</div>
                                                    <div className="font-extrabold text-teal-800 text-sm mt-0.5">
                                                        {formatCurrency(result.firstYearTaxBreakdown.netDividend)}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* 資金來源結構條 (新增房產活化折抵條) */}
                                    <div className="space-y-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                        <div className="flex items-center text-sm">
                                            <div className="w-36 text-slate-600 font-bold">
                                                {result.isDividendMode ? '不賣股應備總本金' : '4%動態提領應備總額'}
                                            </div>
                                            <div className="flex-1 mx-3 bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                                <div className="bg-slate-700 h-full w-full"></div>
                                            </div>
                                            <div className="w-28 text-right font-extrabold text-slate-800">{formatCurrency(result.grossNeed)}</div>
                                        </div>
                                        <div className="flex items-center text-sm">
                                            <div className="w-36 text-purple-600 font-medium">
                                                {result.isDividendMode ? '勞退新制本金折抵' : '政府勞保+勞退折現'}
                                            </div>
                                            <div className="flex-1 mx-3 bg-purple-100 h-2.5 rounded-full overflow-hidden">
                                                <div className="bg-purple-500 h-full transition-all duration-300" style={{ width: `${Math.min(100, (result.govDeductions / (result.grossNeed || 1)) * 100)}%` }}></div>
                                            </div>
                                            <div className="w-28 text-right font-bold text-purple-600">{formatCurrency(result.govDeductions)}</div>
                                        </div>
                                        {params.realEstateMode !== 'none' && (
                                            <div className="flex items-center text-sm">
                                                <div className="w-36 text-teal-600 font-medium">
                                                    {params.realEstateMode === 'reverse_mortgage' ? '以房養老現金流折抵' : '留房收租現金流折抵'}
                                                </div>
                                                <div className="flex-1 mx-3 bg-teal-100 h-2.5 rounded-full overflow-hidden">
                                                    <div className="bg-teal-500 h-full transition-all duration-300" style={{ width: `${Math.min(100, (result.realEstateDeductions / (result.grossNeed || 1)) * 100)}%` }}></div>
                                                </div>
                                                <div className="w-28 text-right font-bold text-teal-600">{formatCurrency(result.realEstateDeductions)}</div>
                                            </div>
                                        )}
                                        <div className="flex items-center text-sm">
                                            <div className="w-36 text-blue-600 font-medium">個人累積與投資終值</div>
                                            <div className="flex-1 mx-3 bg-blue-100 h-2.5 rounded-full overflow-hidden">
                                                <div className="bg-blue-500 h-full transition-all duration-300" style={{ width: `${Math.min(100, (result.totalSelfInvestmentFV / (result.grossNeed || 1)) * 100)}%` }}></div>
                                            </div>
                                            <div className="w-28 text-right font-bold text-blue-600">{formatCurrency(result.totalSelfInvestmentFV)}</div>
                                        </div>
                                    </div>

                                    {/* 具體行動建議卡片 */}
                                    {result.finalShortfall > 0 ? (
                                        <div className="mb-6 bg-blue-50/80 border border-blue-200 rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center gap-4">
                                            <div className="bg-blue-600 text-white p-3 rounded-xl text-lg shrink-0">
                                                <i className="fas fa-bullseye"></i>
                                            </div>
                                            <div className="flex-1">
                                                <h4 className="font-bold text-blue-900 text-sm">
                                                    可執行的缺口填補行動方案（以退休前報酬 {params.preRetireRoiRate}% 計算）
                                                </h4>
                                                <div className="text-sm text-slate-700 mt-1">
                                                    若要在 {params.retireAge} 歲達成設定目標{params.sorrScenario !== 'none' ? '（含抵禦退休初期股災緩衝）' : ''}，除了目前每月定期定額 <span className="font-bold">{formatCurrency(params.currentMonthlyInvestment)}</span> 外，建議每月<span className="font-bold text-rose-600">再增加投入 {formatCurrency(result.suggestedMonthlySave)}</span>（合計每月定期定額 <span className="font-extrabold text-blue-800 underline">{formatCurrency(result.totalMonthlySave)}</span>），或啟用左側「4. 房產活化」釋放房產現金流。
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="mb-6 bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center gap-3 text-emerald-800 text-sm">
                                            <i className="fas fa-check-circle text-emerald-600 text-xl"></i>
                                            <div>
                                                <strong>財務軌跡健全！</strong> 您目前的資產配置與房產/退休金現金流，即使在所選的稅制與市場情境下，仍足以穩健支應至 {params.lifeExpectancy} 歲。
                                            </div>
                                        </div>
                                    )}

                                    {/* 資產消耗曲線圖 */}
                                    <div className="border-t border-slate-100 pt-5">
                                        <h3 className="font-bold text-slate-700 mb-2 flex items-center gap-2 text-sm">
                                            <i className="fas fa-chart-area text-amber-500"></i> 退休後資產淨值模擬圖：平順市場 (橘線) vs. 股災壓力測試 (紅線)
                                        </h3>
                                        <CashFlowChart
                                            chartData={result.chartData}
                                            retireAge={params.retireAge}
                                            lifeExpectancy={params.lifeExpectancy}
                                            strategy={params.withdrawalStrategy}
                                            sorrScenario={params.sorrScenario}
                                        />
                                    </div>
                                </div>

                                {/* 2. 資金需求細項設定表 */}
                                <div className="glass-card rounded-2xl overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
                                        <div>
                                            <h3 className="font-bold text-slate-800">退休生活與醫療長照需求明細</h3>
                                            <p className="text-xs text-slate-500">
                                                退休首年每月生活費總需求（通膨後）：<strong className="text-rose-600">{formatCurrency(result.firstYearMonthlyNeed)} / 月</strong>
                                            </p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => addItem('flow')} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
                                                <i className="fas fa-plus"></i> 新增每月支出
                                            </button>
                                            <button onClick={() => addItem('stock')} className="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
                                                <i className="fas fa-plus"></i> 新增一次性準備金
                                            </button>
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="text-xs text-slate-500 uppercase bg-slate-100">
                                                <tr>
                                                    <th className="px-4 py-3">支出項目</th>
                                                    <th className="px-4 py-3 text-center">性質</th>
                                                    <th className="px-4 py-3 text-right">目前物價金額</th>
                                                    <th className="px-4 py-3 text-center">通膨放大 ({result.yearsToRetire}年)</th>
                                                    <th className="px-4 py-3 text-right">退休首年需求 (通膨後)</th>
                                                    <th className="px-4 py-3 text-right font-bold text-slate-800">
                                                        {result.isDividendMode ? '對應所需生息本金' : '折現應備本金'}
                                                    </th>
                                                    <th className="w-10"></th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {result.detailedItems.map((item) => {
                                                    const isFullyCovered = item.coverageRatio === 1;
                                                    const isPartiallyCovered = item.coverageRatio > 0 && item.coverageRatio < 1;

                                                    return (
                                                        <tr key={item.id} className={`hover:bg-slate-50 transition ${isFullyCovered ? 'bg-emerald-50/40 opacity-60' : ''}`}>
                                                            <td className="px-4 py-3">
                                                                <input
                                                                    type="text"
                                                                    value={item.name}
                                                                    onChange={(e) => updateItem(item.id, 'name', e.target.value)}
                                                                    className={`w-full bg-transparent border-b border-transparent hover:border-slate-300 focus:border-blue-500 outline-none font-medium ${isFullyCovered ? 'line-through text-slate-400' : 'text-slate-700'}`}
                                                                />
                                                                {isFullyCovered && <span className="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-bold">商業保險 100% 覆蓋</span>}
                                                                {isPartiallyCovered && <span className="text-[10px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-bold">保險已折抵 50%</span>}
                                                            </td>
                                                            <td className="px-4 py-3 text-center">
                                                                <span className={`text-[11px] px-2 py-0.5 rounded-full font-medium ${item.type === 'flow' ? 'bg-blue-50 text-blue-600' : 'bg-amber-50 text-amber-700'}`}>
                                                                    {item.type === 'flow' ? '每月持續' : '單筆提領'}
                                                                </span>
                                                            </td>
                                                            <td className="px-4 py-3 text-right">
                                                                <div className="flex items-center justify-end gap-1">
                                                                    <span className="text-slate-400 text-xs">$</span>
                                                                    <input
                                                                        type="number"
                                                                        value={item.currentAmount}
                                                                        onChange={(e) => updateItem(item.id, 'currentAmount', parseFloat(e.target.value) || 0)}
                                                                        className="w-24 text-right bg-transparent border-b border-dashed border-slate-300 focus:border-blue-500 outline-none font-semibold text-slate-700"
                                                                    />
                                                                </div>
                                                            </td>
                                                            <td className="px-4 py-3 text-center">
                                                                <span className="inflation-badge">{result.inflationMultiplier.toFixed(2)}x</span>
                                                            </td>
                                                            <td className="px-4 py-3 text-right">
                                                                {isFullyCovered ? <span className="text-slate-400">-</span> : (
                                                                    <div>
                                                                        <span className="font-bold text-slate-700">
                                                                            {item.type === 'flow' ? formatNumber(item.monthlyFuture) : formatNumber(item.futureValue)}
                                                                        </span>
                                                                        <span className="text-[11px] text-slate-400 ml-1">{item.type === 'flow' ? '/月' : '一次'}</span>
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td className="px-4 py-3 text-right font-extrabold text-slate-800">
                                                                {isFullyCovered ? <span className="text-emerald-600">$0</span> : formatCurrency(item.requiredCapital)}
                                                            </td>
                                                            <td className="px-3 py-3 text-center">
                                                                {!item.isInsuranceItem && (
                                                                    <button onClick={() => deleteItem(item.id)} className="text-slate-300 hover:text-rose-500 transition">
                                                                        <i className="fas fa-trash-alt"></i>
                                                                    </button>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* 3. 全生涯現金流明細表 (新增房產活化現金流與股災對比) */}
                                <div className="glass-card rounded-2xl overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                                        <h3 className="font-bold text-slate-800 flex items-center gap-2">
                                            <i className="fas fa-table text-slate-500"></i> 全生涯年度配息、稅費、房產活化與股災測試明細表
                                        </h3>
                                        <button onClick={downloadCSV} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
                                            <i className="fas fa-file-csv"></i> 匯出完整 CSV
                                        </button>
                                    </div>
                                    <div className="overflow-x-auto max-h-96">
                                        <table className="w-full text-left cashflow-table">
                                            <thead className="sticky top-0 z-10 shadow-sm">
                                                <tr>
                                                    <th>年齡</th>
                                                    <th>階段</th>
                                                    <th className="text-right">稅後淨配息</th>
                                                    <th className="text-right">二代健保/稅結算</th>
                                                    <th className="text-right">房產活化收入</th>
                                                    <th className="text-right">當年勞保年金</th>
                                                    <th className="text-right">當年總支出</th>
                                                    <th className="text-center">現金流覆蓋率</th>
                                                    <th className="text-right">期末資產結餘</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {result.timelineData.map((row) => (
                                                    <tr key={row.age} className={row.gap < 0 ? 'bg-rose-50/70' : row.type === '⚡股災期' ? 'bg-amber-50/60' : ''}>
                                                        <td className="font-bold text-slate-700">{row.age} 歲</td>
                                                        <td>
                                                            <span className={`text-xs px-2 py-0.5 rounded-full font-semibold ${row.type === '累積期' ? 'bg-blue-100 text-blue-700' : row.type === '⚡股災期' ? 'bg-rose-100 text-rose-700 font-bold' : row.type === '退休期' ? 'bg-amber-100 text-amber-700' : 'bg-slate-200 text-slate-700'}`}>
                                                                {row.type}
                                                            </span>
                                                        </td>
                                                        <td className="text-right font-mono text-amber-600 font-bold">
                                                            {row.netDividend > 0 ? `+${formatNumber(row.netDividend)}` : '-'}
                                                        </td>
                                                        <td className={`text-right font-mono text-xs font-semibold ${row.taxAndNHI < 0 ? 'text-emerald-600' : row.taxAndNHI > 0 ? 'text-rose-600' : 'text-slate-400'}`}>
                                                            {row.grossDividend > 0 ? (
                                                                row.taxAndNHI <= 0
                                                                    ? `+${formatNumber(Math.abs(row.taxAndNHI))} (退稅)`
                                                                    : `-${formatNumber(row.taxAndNHI)} (扣繳)`
                                                            ) : '-'}
                                                        </td>
                                                        <td className="text-right font-mono text-teal-600 font-semibold">
                                                            {row.realEstateIncome > 0 ? `+${formatNumber(row.realEstateIncome)}` : '-'}
                                                        </td>
                                                        <td className="text-right font-mono text-purple-600">
                                                            {row.income > 0 ? `+${formatNumber(row.income)}` : '-'}
                                                        </td>
                                                        <td className="text-right font-mono text-rose-600">
                                                            {row.needs > 0 ? `-${formatNumber(row.needs)}` : '-'}
                                                        </td>
                                                        <td className="text-center font-mono text-xs">
                                                            {row.coverage !== null ? (
                                                                <span className={`px-2 py-0.5 rounded font-bold ${row.coverage >= 100 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                                                    {row.coverage.toFixed(0)}%
                                                                </span>
                                                            ) : '-'}
                                                        </td>
                                                        <td className={`text-right font-mono font-bold ${row.gap < 0 ? 'text-rose-600' : 'text-slate-800'}`}>
                                                            {formatNumber(row.gap)}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
