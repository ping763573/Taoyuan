<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>霓虹星際打地鼠 | Cyber Whack</title>
  <style>
    :root {
      /* 預設主題：經典藍紫 */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #4c1d95 100%);
      --accent-primary: #38bdf8;
      --accent-secondary: #c084fc;
      --accent-glow: rgba(56, 189, 248, 0.5);
      --card-bg: rgba(15, 23, 42, 0.65);
      --card-border: rgba(255, 255, 255, 0.14);
      --hole-bg: radial-gradient(circle at 50% 35%, #090d16 0%, #02040a 85%);
      --hole-rim: rgba(56, 189, 248, 0.45);
      --bot-body: linear-gradient(180deg, #60a5fa 0%, #3b82f6 60%, #1d4ed8 100%);
      --bot-visor: #0f172a;
      --bot-eye: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #f43f5e;
      --gold: #fbbf24;
    }

    /* 主題二：極光翡翠 */
    [data-theme="emerald"] {
      --bg-gradient: linear-gradient(135deg, #042f2e 0%, #064e3b 48%, #0f766e 100%);
      --accent-primary: #34d399;
      --accent-secondary: #2dd4bf;
      --accent-glow: rgba(52, 211, 153, 0.5);
      --card-bg: rgba(4, 47, 46, 0.65);
      --hole-rim: rgba(52, 211, 153, 0.45);
      --bot-body: linear-gradient(180deg, #6ee7b7 0%, #10b981 60%, #047857 100%);
      --bot-eye: #a7f3d0;
    }

    /* 主題三：日落霓虹 */
    [data-theme="sunset"] {
      --bg-gradient: linear-gradient(135deg, #1f102b 0%, #4a154b 48%, #9d174d 100%);
      --accent-primary: #fb7185;
      --accent-secondary: #fbbf24;
      --accent-glow: rgba(251, 113, 133, 0.5);
      --card-bg: rgba(31, 16, 43, 0.68);
      --hole-rim: rgba(251, 113, 133, 0.5);
      --bot-body: linear-gradient(180deg, #fda4af 0%, #f43f5e 60%, #be123c 100%);
      --bot-eye: #fde047;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.6s ease;
      position: relative;
    }

    /* 背景動態光暈裝飾 */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }
    .bg-orb-1 {
      width: 340px;
      height: 340px;
      background: var(--accent-primary);
      top: -80px;
      left: -80px;
    }
    .bg-orb-2 {
      width: 380px;
      height: 380px;
      background: var(--accent-secondary);
      bottom: -100px;
      right: -80px;
      animation-delay: -6s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.12); }
    }

    /* 右上角設定按鈕 */
    .settings-trigger {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 50;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .settings-trigger:hover {
      transform: translateY(-2px) rotate(25deg);
      border-color: var(--accent-primary);
      box-shadow: 0 0 18px var(--accent-glow);
    }
    .settings-trigger svg {
      width: 22px;
      height: 22px;
    }

    /* 設定下拉面板 */
    .settings-popover {
      position: fixed;
      top: 76px;
      right: 20px;
      z-index: 50;
      width: 260px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(-10px) scale(0.96);
      pointer-events: none;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .settings-popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .settings-title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .setting-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .setting-label {
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* 音效開關 Switch */
    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.25s ease;
    }
    .toggle-switch.active {
      background: var(--accent-primary);
    }
    .toggle-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .toggle-switch.active::after {
      transform: translateX(22px);
    }

    /* 配色選擇器 */
    .theme-options {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .theme-btn {
      flex: 1;
      padding: 8px 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .theme-btn.active {
      border-color: var(--accent-primary);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .theme-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }

    /* 主容器 */
    .game-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 頂部儀表板 HUD */
    .hud-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 16px 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hud-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      text-align: center;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 14px;
      padding: 8px 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 1.45rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(90deg, #fff, var(--accent-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-value.combo-highlight {
      background: linear-gradient(90deg, #fde047, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 倒數計時進度條 */
    .timer-track {
      width: 100%;
      height: 10px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 999px;
      box-shadow: 0 0 12px var(--accent-glow);
      transition: width 0.1s linear, background 0.3s ease;
    }
    .timer-fill.urgent {
      background: linear-gradient(90deg, #f43f5e, #fb923c);
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.7);
    }

    /* 遊戲網格區 */
    .board-container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .board-container.shake {
      animation: boardShake 0.25s ease;
    }

    @keyframes boardShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    /* 單一洞口 */
    .hole {
      aspect-ratio: 1 / 1;
      position: relative;
      border-radius: 22px;
      background: var(--hole-bg);
      border: 2px solid var(--hole-rim);
      box-shadow:
        inset 0 12px 24px rgba(0, 0, 0, 0.85),
        0 4px 16px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.1s ease;
    }
    .hole:active {
      transform: scale(0.96);
    }

    /* 洞口內部發光環 */
    .hole::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 16px;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    /* 發光星際小機器人（地鼠） */
    .mole {
      position: absolute;
      left: 50%;
      bottom: -85%;
      width: 74%;
      height: 78%;
      transform: translateX(-50%) scale(0.85);
      transition: bottom 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .hole.up .mole {
      bottom: 6%;
      transform: translateX(-50%) scale(1);
    }

    /* 機器人天線 */
    .bot-antenna {
      width: 4px;
      height: 12px;
      background: var(--accent-primary);
      position: relative;
      border-radius: 2px;
    }
    .bot-antenna::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
      animation: pulseBeacon 0.9s infinite alternate;
    }

    @keyframes pulseBeacon {
      from { transform: translateX(-50%) scale(0.85); opacity: 0.8; }
      to { transform: translateX(-50%) scale(1.2); opacity: 1; }
    }

    /* 機器人頭部外殼 */
    .bot-head {
      width: 100%;
      height: 78%;
      background: var(--bot-body);
      border-radius: 26px 26px 18px 18px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      box-shadow:
        0 -4px 16px var(--accent-glow),
        inset 0 6px 10px rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      position: relative;
    }

    /* 機器人面罩螢幕 */
    .bot-visor {
      width: 84%;
      height: 52%;
      background: var(--bot-visor);
      border-radius: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .bot-eye {
      width: 12px;
      height: 14px;
      border-radius: 6px;
      background: var(--bot-eye);
      box-shadow: 0 0 10px var(--bot-eye);
      transition: all 0.12s ease;
    }

    /* 被擊中時的暈眩表情 */
    .hole.whacked .mole {
      bottom: -85%;
      transform: translateX(-50%) scale(0.75) rotate(12deg);
      transition: bottom 0.16s ease-in, transform 0.16s ease-in;
    }
    .hole.whacked .bot-eye {
      height: 4px;
      border-radius: 2px;
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger);
    }
    .hole.whacked {
      border-color: var(--gold);
      box-shadow: 0 0 22px rgba(251, 191, 36, 0.45);
    }

    /* 飄浮得分與特效字 */
    .floating-text {
      position: fixed;
      pointer-events: none;
      z-index: 40;
      font-weight: 900;
      font-size: 1.35rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      animation: floatScore 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .floating-text.hit {
      color: #fde047;
    }
    .floating-text.combo {
      color: #38bdf8;
      font-size: 1.1rem;
    }
    .floating-text.miss {
      color: #fb7185;
      font-size: 1rem;
    }

    @keyframes floatScore {
      0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(0.7);
      }
      30% {
        transform: translate(-50%, -18px) scale(1.15);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -52px) scale(0.95);
      }
    }

    /* 擊中光波擴散特效 */
    .hit-ripple {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      pointer-events: none;
      z-index: 35;
      transform: translate(-50%, -50%) scale(0.5);
      animation: rippleOut 0.45s ease-out forwards;
    }
    @keyframes rippleOut {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3.2);
      }
    }

    /* 覆蓋層視窗（開始畫面 & 結算畫面） */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(9, 13, 24, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      transform: translateY(0) scale(1);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .overlay.hidden .modal-card {
      transform: translateY(20px) scale(0.94);
    }

    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent-primary);
      border: 1px solid rgba(56, 189, 248, 0.35);
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 20%, var(--accent-primary) 65%, var(--accent-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .record-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .record-item-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .record-item-val {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--gold);
    }

    .new-record-tag {
      display: inline-block;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.45);
      animation: bounceTag 0.8s infinite alternate;
    }
    @keyframes bounceTag {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }

    .primary-btn {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #090d16;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      cursor: pointer;
      box-shadow: 0 10px 26px var(--accent-glow);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .primary-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 14px 32px var(--accent-glow);
    }
    .primary-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    @media (max-width: 420px) {
      .game-wrapper { padding: 14px; gap: 14px; }
      .board-container { padding: 14px; }
      .grid { gap: 11px; }
      .stat-value { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- 背景流光 -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <!-- 右上角浮動設定按鈕 -->
  <button class="settings-trigger" id="settingsBtn" aria-label="遊戲設定" title="遊戲設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <!-- 設定面板 -->
  <div class="settings-popover" id="settingsPopover">
    <div class="settings-title">
      <span>偏好設定</span>
      <span style="font-size: 0.72rem; opacity: 0.7;">即時套用</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">合成器音效</span>
      <div class="toggle-switch active" id="soundToggle" role="switch" aria-checked="true"></div>
    </div>
    <div class="setting-row" style="flex-direction: column; align-items: flex-start;">
      <span class="setting-label">視覺主題配色</span>
      <div class="theme-options" id="themeOptions">
        <button class="theme-btn active" data-theme-val="default">
          <span class="theme-dot" style="background: linear-gradient(135deg, #38bdf8, #8b5cf6);"></span>
          <span>經典藍紫</span>
        </button>
        <button class="theme-btn" data-theme-val="emerald">
          <span class="theme-dot" style="background: linear-gradient(135deg, #34d399, #0d9488);"></span>
          <span>極光翡翠</span>
        </button>
        <button class="theme-btn" data-theme-val="sunset">
          <span class="theme-dot" style="background: linear-gradient(135deg, #fb7185, #f59e0b);"></span>
          <span>日落霓虹</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 主遊戲區 -->
  <main class="game-wrapper">
    <!-- 頂部狀態欄 -->
    <section class="hud-panel">
      <div class="hud-stats">
        <div class="stat-box">
          <div class="stat-label">目前分數</div>
          <div class="stat-value" id="scoreDisplay">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">連擊 COMBO</div>
          <div class="stat-value combo-highlight" id="comboDisplay">0x</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">剩餘時間</div>
          <div class="stat-value" id="timeDisplay">30.0s</div>
        </div>
      </div>
      <div class="timer-track">
        <div class="timer-fill" id="timerFill"></div>
      </div>
    </section>

    <!-- 3x3 洞口網格 -->
    <section class="board-container" id="boardContainer">
      <div class="grid" id="gameGrid"></div>
    </section>
  </main>

  <!-- 遊戲開始畫面 -->
  <div class="overlay" id="startOverlay">
    <div class="modal-card">
      <div class="badge">ARCADE EDITION • 30S RUSH</div>
      <h1 class="modal-title">霓虹星際打地鼠</h1>
      <p class="modal-desc">點擊探出頭的發光機器人！每獲得 10 分節奏將會全面加速，保持連擊創造最高紀錄。</p>
      <div class="record-box">
        <div>
          <div class="record-item-label">歷史最高紀錄</div>
          <div class="record-item-val" id="startHighScore">0</div>
        </div>
      </div>
      <button class="primary-btn" id="startBtn">開始遊戲</button>
    </div>
  </div>

  <!-- 遊戲結算畫面 -->
  <div class="overlay hidden" id="endOverlay">
    <div class="modal-card">
      <div id="newRecordBadge" class="new-record-tag" style="display: none;">★ 刷新最高紀錄！</div>
      <h2 class="modal-title">時間到！挑戰結束</h2>
      <p class="modal-desc" id="endSummaryText">反應速度相當驚人，再來一局突破極限吧！</p>
      <div class="record-box">
        <div>
          <div class="record-item-label">本次得分</div>
          <div class="record-item-val" id="finalScore" style="color: var(--accent-primary);">0</div>
        </div>
        <div style="width: 1px; height: 36px; background: rgba(255,255,255,0.12);"></div>
        <div>
          <div class="record-item-label">最高紀錄</div>
          <div class="record-item-val" id="endHighScore">0</div>
        </div>
      </div>
      <button class="primary-btn" id="restartBtn">再玩一次</button>
    </div>
  </div>

  <script>
    /**
     * Web Audio API 動態音效合成器（無需任何外部音效檔）
     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // 1. 按鈕點擊音
      playClick() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(980, now + 0.06);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      }

      // 2. 擊中地鼠清脆得分音（隨連擊微幅升調）
      playHit(combo = 1) {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const pitchBoost = Math.min(combo * 28, 360);

        // 主清脆音
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(520 + pitchBoost, now);
        osc1.frequency.exponentialRampToValueAtTime(1180 + pitchBoost, now + 0.11);
        gain1.gain.setValueAtTime(0.28, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        // 高頻泛音點綴
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1040 + pitchBoost, now + 0.02);
        osc2.frequency.exponentialRampToValueAtTime(1760 + pitchBoost, now + 0.14);
        gain2.gain.setValueAtTime(0.16, now + 0.02);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        osc1.connect(gain1);
        gain1.connect(this.ctx.destination);
        osc2.connect(gain2);
        gain2.connect(this.ctx.destination);

        osc1.start(now);
        osc1.stop(now + 0.13);
        osc2.start(now + 0.02);
        osc2.stop(now + 0.16);
      }

      // 3. 搥空或失誤低沈音
      playMiss() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(175, now);
        osc.frequency.exponentialRampToValueAtTime(68, now + 0.16);

        // 低通濾波讓聲音更厚實不刺耳
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(420, now);

        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.18);
      }

      // 4. 遊戲開始上行和弦音
      playStart() {
        if (!this.enabled) return;
        this.init();
        const notes = [440, 554.37, 659.25, 880]; // A4, C#5, E5, A5
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.065;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        });
      }

      // 5. 遊戲結束/結算音效
      playGameOver(isNewRecord = false) {
        if (!this.enabled) return;
        this.init();
        const notes = isNewRecord
          ? [523.25, 659.25, 783.99, 1046.5, 1318.5] // 破紀錄歡慶旋律
          : [587.33, 523.25, 440, 392];             // 結束收尾旋律
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.1;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isNewRecord ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.34);
        });
      }
    }

    /**
     * 遊戲主邏輯控制
     */
    const GAME_DURATION = 30; // 每局 30 秒
    const GRID_SIZE = 9;      // 3x3 洞口
    const STORAGE_KEY = 'cyber_whack_high_score_v1';

    const sound = new SoundEngine();

    // DOM 元素參考
    const gameGrid = document.getElementById('gameGrid');
    const boardContainer = document.getElementById('boardContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const comboDisplay = document.getElementById('comboDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const timerFill = document.getElementById('timerFill');

    const startOverlay = document.getElementById('startOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const startHighScoreEl = document.getElementById('startHighScore');
    const endHighScoreEl = document.getElementById('endHighScore');
    const finalScoreEl = document.getElementById('finalScore');
    const newRecordBadge = document.getElementById('newRecordBadge');
    const endSummaryText = document.getElementById('endSummaryText');

    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPopover = document.getElementById('settingsPopover');
    const soundToggle = document.getElementById('soundToggle');
    const themeOptions = document.getElementById('themeOptions');

    // 遊戲狀態變數
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let highScore = Number(localStorage.getItem(STORAGE_KEY)) || 0;
    let isPlaying = false;
    let lastHoleIndex = -1;
    let peepTimer = null;
    let countdownInterval = null;
    let endTime = 0;
    const holes = [];

    // 初始化最高分顯示
    startHighScoreEl.textContent = highScore;

    // 建立 3x3 洞口與機器人結構
    function createBoard() {
      gameGrid.innerHTML = '';
      for (let i = 0; i < GRID_SIZE; i++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        hole.dataset.index = i;

        hole.innerHTML = `
          <div class="mole">
            <div class="bot-antenna"></div>
            <div class="bot-head">
              <div class="bot-visor">
                <span class="bot-eye"></span>
                <span class="bot-eye"></span>
              </div>
            </div>
          </div>
        `;

        // 支援滑鼠與觸控即時點擊（pointerdown 反應最快無延遲）
        hole.addEventListener('pointerdown', (e) => handleHoleTap(e, hole));
        gameGrid.appendChild(hole);
        holes.push({
          el: hole,
          hideTimeout: null
        });
      }
    }

    // 計算動態難度（每得 10 分提升一個速度階級）
    function getDifficultyParams() {
      const level = Math.floor(score / 10);
      // 停留時間從 950ms 隨等級縮短，最低 360ms
      const stayTime = Math.max(360, 950 - level * 95);
      // 出現間隔從 720ms 隨等級縮短，最低 260ms
      const nextDelay = Math.max(260, 720 - level * 75);
      return { stayTime, nextDelay };
    }

    // 隨機挑選下一個洞口（避免連續同一個洞）
    function pickRandomHoleIndex() {
      let idx;
      do {
        idx = Math.floor(Math.random() * GRID_SIZE);
      } while (idx === lastHoleIndex);
      lastHoleIndex = idx;
      return idx;
    }

    // 讓地鼠探出頭
    function peep() {
      if (!isPlaying) return;

      const { stayTime, nextDelay } = getDifficultyParams();
      const idx = pickRandomHoleIndex();
      const holeObj = holes[idx];

      // 清除殘留狀態
      clearTimeout(holeObj.hideTimeout);
      holeObj.el.classList.remove('whacked');
      holeObj.el.classList.add('up');

      // 時間到自動縮回
      holeObj.hideTimeout = setTimeout(() => {
        if (holeObj.el.classList.contains('up')) {
          holeObj.el.classList.remove('up');
          // 沒打到導致中斷連擊
          if (isPlaying && combo > 0) {
            combo = 0;
            updateHUD();
          }
        }
      }, stayTime);

      peepTimer = setTimeout(peep, nextDelay);
    }

    // 處理玩家點擊洞口
    function handleHoleTap(e, holeEl) {
      if (!isPlaying) return;
      e.preventDefault();

      const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

      // 判定是否成功擊中探出頭的地鼠
      if (holeEl.classList.contains('up') && !holeEl.classList.contains('whacked')) {
        holeEl.classList.add('whacked');
        holeEl.classList.remove('up');

        score += 1;
        combo += 1;
        if (combo > maxCombo) maxCombo = combo;

        sound.playHit(combo);
        updateHUD();
        spawnFloatingEffect(clientX, clientY, '+1', 'hit');
        spawnRipple(clientX, clientY);

        if (combo >= 2) {
          spawnFloatingEffect(clientX, clientY - 26, `${combo} COMBO!`, 'combo');
        }
      } else {
        // 搥空失誤
        combo = 0;
        sound.playMiss();
        updateHUD();
        spawnFloatingEffect(clientX, clientY, 'MISS', 'miss');

        boardContainer.classList.remove('shake');
        void boardContainer.offsetWidth; // 觸發重繪以重新播放震動
        boardContainer.classList.add('shake');
      }
    }

    // 產生飄浮文字特效
    function spawnFloatingEffect(x, y, text, type) {
      const el = document.createElement('div');
      el.className = `floating-text ${type}`;
      el.textContent = text;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 760);
    }

    // 產生擊中光波
    function spawnRipple(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'hit-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 460);
    }

    // 更新頂部數據顯示
    function updateHUD() {
      scoreDisplay.textContent = score;
      comboDisplay.textContent = `${combo}x`;
    }

    // 開始新遊戲
    function startGame() {
      sound.playClick();
      sound.playStart();

      score = 0;
      combo = 0;
      maxCombo = 0;
      isPlaying = true;
      lastHoleIndex = -1;

      // 重置所有洞口
      holes.forEach(h => {
        clearTimeout(h.hideTimeout);
        h.el.classList.remove('up', 'whacked');
      });

      updateHUD();
      timerFill.style.width = '100%';
      timerFill.classList.remove('urgent');
      timeDisplay.textContent = `${GAME_DURATION.toFixed(1)}s`;

      startOverlay.classList.add('hidden');
      endOverlay.classList.add('hidden');
      settingsPopover.classList.remove('open');

      endTime = performance.now() + GAME_DURATION * 1000;

      // 啟動平滑倒數計時器
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        const remainingMs = Math.max(0, endTime - performance.now());
        const remainingSec = remainingMs / 1000;
        const pct = (remainingSec / GAME_DURATION) * 100;

        timeDisplay.textContent = `${remainingSec.toFixed(1)}s`;
        timerFill.style.width = `${pct}%`;

        if (remainingSec <= 6) {
          timerFill.classList.add('urgent');
        }

        if (remainingMs <= 0) {
          endGame();
        }
      }, 50);

      // 稍微延遲 350ms 讓玩家準備好後出現第一隻
      clearTimeout(peepTimer);
      peepTimer = setTimeout(peep, 350);
    }

    // 結束遊戲與結算
    function endGame() {
      isPlaying = false;
      clearTimeout(peepTimer);
      clearInterval(countdownInterval);

      holes.forEach(h => {
        clearTimeout(h.hideTimeout);
        h.el.classList.remove('up');
      });

      let isNewRecord = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(STORAGE_KEY, String(highScore));
        isNewRecord = true;
      }

      sound.playGameOver(isNewRecord);

      finalScoreEl.textContent = score;
      endHighScoreEl.textContent = highScore;
      startHighScoreEl.textContent = highScore;
      newRecordBadge.style.display = isNewRecord ? 'inline-block' : 'none';

      if (score >= 40) {
        endSummaryText.textContent = `神級手速！最高達成 ${maxCombo} 連擊，無人能敵！`;
      } else if (score >= 20) {
        endSummaryText.textContent = `節奏掌握得非常精準！最高連擊 ${maxCombo} 次。`;
      } else {
        endSummaryText.textContent = `暖身完畢！抓準節奏連擊可以獲得更高評價喔！`;
      }

      endOverlay.classList.remove('hidden');
    }

    // 事件監聽綁定
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // 右上角設定面板切換
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sound.playClick();
      settingsPopover.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!settingsPopover.contains(e.target) && !settingsBtn.contains(e.target)) {
        settingsPopover.classList.remove('open');
      }
    });

    // 音效開關
    soundToggle.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      soundToggle.classList.toggle('active', sound.enabled);
      soundToggle.setAttribute('aria-checked', String(sound.enabled));
      if (sound.enabled) sound.playClick();
    });

    // 主題配色切換
    themeOptions.addEventListener('click', (e) => {
      const btn = e.target.closest('.theme-btn');
      if (!btn) return;
      sound.playClick();

      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const theme = btn.dataset.themeVal;
      if (theme === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
    });

    // 初始化網格
    createBoard();
  </script>
</body>
</html>
